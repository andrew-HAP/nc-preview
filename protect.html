<style id="nc-protect">
html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }
@media print { html, body { display: none !important; } }
html.nc-print-blank body { visibility: hidden !important; }
body { padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px)) !important; }
</style>
<script>
(function () {
  var COPY = '__COPY_ID__', EXP = Date.parse('__EXPIRES_ISO__'), EXP_TEXT = '__EXPIRES_TEXT__';
  var de = document.documentElement;
  function stop(msg) {
    document.open();
    document.write('<!doctype html><meta name="viewport" content="width=device-width, initial-scale=1"><body style="margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0F1729;color:#F1F1F2;font:16px/1.5 \'Courier New\',Courier,monospace;text-align:center"><p>' + msg + '</p></body>');
    document.close();
  }
  if (!(Date.now() <= EXP)) { stop('This preview expired on ' + EXP_TEXT + '. Please delete any copy you hold.'); return; }
  setInterval(function () { if (Date.now() > EXP) stop('This preview expired on ' + EXP_TEXT + '. Please delete any copy you hold.'); }, 60000);

  var label = 'Noot · Happy Days · Confidential preview · ' + COPY;
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260"><text x="210" y="130" text-anchor="middle" transform="rotate(-28 210 130)" font-family="Courier New, monospace" font-size="15" fill="rgb(128,128,128)" fill-opacity="0.16">' + label + '</text></svg>';
  var bg = 'url("data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '")';
  var css = 'position:fixed!important;inset:0!important;z-index:2147483646!important;pointer-events:none!important;display:block!important;' +
            'visibility:visible!important;opacity:1!important;background-image:' + bg + '!important;background-repeat:repeat!important;transform:none!important;';
  var id = 'w' + Math.random().toString(36).slice(2);
  function mark() {
    var w = document.getElementById(id);
    if (!w) { w = document.createElement('div'); w.id = id; w.setAttribute('aria-hidden', 'true'); }
    if (w.getAttribute('style') !== css) w.setAttribute('style', css);
    if (w.parentNode !== document.body || document.body.lastElementChild !== w) document.body.appendChild(w);
  }
  var BAR = '\u00a9 Happy Days Agency Limited \u00b7 Confidential preview \u00b7 Do not copy';
  var barCss = 'position:fixed!important;left:0!important;right:0!important;bottom:0!important;z-index:2147483645!important;display:block!important;' +
               'visibility:visible!important;opacity:1!important;transform:none!important;margin:0!important;' +
               'padding:7px 12px calc(7px + env(safe-area-inset-bottom, 0px))!important;background:#241008!important;color:#FBF9F2!important;' +
               'font:600 11px/1.3 Figtree,system-ui,sans-serif!important;text-align:center!important;letter-spacing:.02em!important;pointer-events:none!important;';
  var bid = 'b' + Math.random().toString(36).slice(2);
  function bar() {
    var b = document.getElementById(bid);
    if (!b) { b = document.createElement('div'); b.id = bid; }
    if (b.textContent !== BAR) b.textContent = BAR;
    if (b.getAttribute('style') !== barCss) b.setAttribute('style', barCss);
    if (b.parentNode !== document.body) document.body.appendChild(b);
  }
  var mark0 = mark; mark = function () { bar(); mark0(); };
  mark();
  new MutationObserver(function () { mark(); }).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class', 'hidden'] });
  setInterval(mark, 1000);

  ['contextmenu', 'copy', 'cut', 'dragstart', 'selectstart'].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      if (ev === 'selectstart' && e.target.closest && e.target.closest('input, textarea')) return;
      e.preventDefault();
    }, true);
  });
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    if ((e.metaKey || e.ctrlKey) && ['s', 'p', 'c', 'x', 'a', 'u'].indexOf(k) > -1) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  window.addEventListener('beforeprint', function () { de.classList.add('nc-print-blank'); });
  window.addEventListener('afterprint', function () { de.classList.remove('nc-print-blank'); });
})();
</script>
